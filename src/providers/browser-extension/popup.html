<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Styx Browser Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px 16px;
      width: 280px;
      color: #111827;
      background: #ffffff;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 8px 0;
    }
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin: 6px 0;
    }
    .label {
      color: #6b7280;
    }
    .badge {
      font-weight: 600;
    }
    .ok { color: #059669; }
    .warn { color: #d97706; }
    .err { color: #dc2626; }
    .meta {
      margin-top: 8px;
      font-size: 11px;
      color: #6b7280;
      word-break: break-all;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      cursor: pointer;
    }
    button:hover {
      background: #f3f4f6;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .danger {
      color: #b91c1c;
      border-color: #fecaca;
      background: #fef2f2;
    }
    .danger:hover:not(:disabled) {
      background: #fee2e2;
    }
  </style>
</head>
<body>
  <h1>Styx Browser Bridge</h1>
  <div class="row">
    <span class="label">Styx Host</span>
    <span id="host-status" class="badge">Checking…</span>
  </div>
  <div class="row">
    <span class="label">Attached tabs</span>
    <span id="attached-count" class="badge">0</span>
  </div>
  <div class="row">
    <span class="label">Styx tabs</span>
    <span id="styx-tabs-count" class="badge">0</span>
  </div>
  <div id="error-box" class="meta"></div>
  <div class="meta">ID: <span id="ext-id"></span></div>
  <div class="actions">
    <button id="reconnect-btn" type="button">Reconnect</button>
    <button id="detach-btn" type="button">Detach tabs</button>
  </div>
  <div class="actions">
    <button id="close-styx-btn" class="danger" type="button">Close Styx tabs</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
