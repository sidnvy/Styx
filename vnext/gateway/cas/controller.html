<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Styx CAS continuation experiment</title>
  <style>
    :root {font: 14px system-ui, sans-serif; color-scheme: light dark}
    body {margin: 0; padding: 16px; color: CanvasText; background: Canvas}
    .panel {border: 1px solid GrayText; border-radius: 10px; padding: 14px; max-width: 540px}
    h3 {font-size: 15px; margin: 0 0 10px}
    p {margin: 8px 0; line-height: 1.5}
    .minor {color: GrayText; font-size: 12px}
    .state {font-weight: 600; overflow-wrap: anywhere}
    button {border: 1px solid GrayText; background: Canvas; color: CanvasText;
      padding: 7px 12px; border-radius: 7px; cursor: pointer}
    button:disabled {opacity: .5; cursor: default}
  </style>
</head>
<body>
  <section class="panel" aria-live="polite">
    <h3>Styx CAS — safe turn-continuation experiment</h3>
    <p id="state" class="state">Waiting for ChatGPT App initialization…</p>
    <p id="detail" class="minor">This card can request new Chat turns. It cannot run shell commands or modify a Host.</p>
    <button id="stop" disabled type="button">Stop experiment</button>
  </section>
  <script>
    (() => {
      'use strict';
      const parent = window.parent;
      const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      const state = document.getElementById('state');
      const detail = document.getElementById('detail');
      const stopButton = document.getElementById('stop');
      const controllerId = crypto.randomUUID();
      const pending = new Map();
      let serial = 0, runId = null, active = true, busy = false, timer = null;
      let hostReady = false;

      function paint(label, explanation = '') {
        state.textContent = label;
        detail.textContent = explanation || 'Only exact consumed wakes prove a new model turn ran.';
      }
      function post(message) {
        parent.postMessage(message, '*');
      }
      function request(method, params, timeout = 15000) {
        if (!active) return Promise.reject(Error('cas_view_closed'));
        const id = ++serial;
        return new Promise((resolve, reject) => {
          const alarm = setTimeout(() => {
            pending.delete(id);
            reject(Error('cas_host_timeout'));
          }, timeout);
          pending.set(id, {resolve, reject, alarm});
          post({jsonrpc: '2.0', id, method, params});
        });
      }
      function notify(method, params = {}) {
        post({jsonrpc: '2.0', method, params});
      }
      function tool(name, args) {
        return request('tools/call', {name, arguments: args}).then(response => {
          if (response.isError) throw Error(response.structuredContent?.error || 'cas_tool_rejected');
          if (!response.structuredContent || typeof response.structuredContent !== 'object')
            throw Error('cas_tool_missing_state');
          return response.structuredContent;
        });
      }
      function teardown() {
        active = false;
        if (timer !== null) clearTimeout(timer);
        timer = null;
        for (const item of pending.values()) {
          clearTimeout(item.alarm);
          item.reject(Error('cas_view_closed'));
        }
        pending.clear();
      }
      function chooseRun(value) {
        if (typeof value !== 'string' || !UUID.test(value)) return;
        if (runId && runId !== value) {
          paint('Conflicting run identity', 'This controller cannot be retargeted.');
          teardown();
          return;
        }
        if (!runId) {
          runId = value;
          stopButton.disabled = false;
          schedule(100);
        }
      }
      function schedule(ms) {
        if (!active || !hostReady || !runId || timer !== null) return;
        timer = setTimeout(async () => {
          timer = null;
          if (!active) return;
          try { await tick(); }
          catch (error) { paint('Host or MCP call unavailable', String(error?.message || 'unknown').slice(0, 120)); }
          finally {
            if (active) schedule(document.visibilityState === 'hidden' ? 15000 : 4000);
          }
        }, ms);
      }
      async function tick() {
        if (busy || !hostReady || !runId || !active) return;
        busy = true;
        try {
          const row = await tool('cas_experiment_poll', {run_id: runId});
          if (row.status !== 'running' || !row.wake) {
            paint('CAS ' + row.status, 'Consumed rounds: ' + row.completed_rounds + '/' + row.rounds);
            return;
          }
          paint('Round ' + row.wake.round + '/' + row.rounds + ' — ' + row.wake.phase,
            'Host dispatch alone is not model-turn proof. Consumed: ' + row.completed_rounds);
          if (row.wake.phase !== 'pending' || Date.now() < row.wake.due_at) return;
          const claim = await tool('cas_experiment_claim', {
            run_id: runId, controller_id: controllerId
          });
          if (!claim.claimed) return;
          // prepare is a durable, irreversible dispatch fence. Reload never resends it.
          const prepared = await tool('cas_experiment_prepare', {
            run_id: runId, controller_id: controllerId, claim_id: claim.claim_id
          });
          let accepted = false;
          try {
            paint('Dispatching round ' + prepared.round + '…',
              'The Host may accept ui/message without actually starting a new model turn.');
            await request('ui/message', {
              role: 'user', content: [{type: 'text', text: prepared.message}]
            }, 30000);
            accepted = true;
          } catch (_) {
            // A timeout or rejection cannot prove whether the Host delivered the message.
          }
          try {
            const outcome = await tool('cas_experiment_finish', {
              run_id: runId, controller_id: controllerId,
              attempt_id: prepared.attempt_id, accepted
            });
            paint(outcome.wake?.phase || outcome.status,
              accepted ? 'Host accepted dispatch; awaiting exact model consume.' :
                'Delivery unknown; never auto-resend this attempt.');
          } catch (_) {
            paint('Dispatch outcome not confirmed', 'Never auto-resend a prepared attempt.');
          }
        } finally { busy = false; }
      }
      window.addEventListener('message', event => {
        if (event.source !== parent || !event.data || event.data.jsonrpc !== '2.0') return;
        const message = event.data;
        if (Object.hasOwn(message, 'id') && pending.has(message.id)) {
          const item = pending.get(message.id);
          pending.delete(message.id);
          clearTimeout(item.alarm);
          if (message.error || message.result?.isError)
            item.reject(Error(message.error?.message || 'cas_host_error'));
          else item.resolve(message.result);
          return;
        }
        if (message.method === 'ui/notifications/tool-input')
          chooseRun(message.params?.arguments?.run_id);
        if (message.method === 'ui/notifications/tool-result')
          chooseRun(message.params?.structuredContent?.run_id);
        if (message.method === 'ui/resource-teardown' && Object.hasOwn(message, 'id')) {
          teardown();
          post({jsonrpc: '2.0', id: message.id, result: {}});
        }
      });
      window.addEventListener('pagehide', teardown);
      stopButton.addEventListener('click', async () => {
        if (!runId || !active) return;
        stopButton.disabled = true;
        try {
          await tool('cas_experiment_stop', {run_id: runId});
          paint('Stopped by user', 'No further automatic turns will be requested.');
        } catch (error) {
          paint('Stop not confirmed', String(error?.message || 'unknown'));
          stopButton.disabled = false;
        }
      });
      request('ui/initialize', {
        protocolVersion: '2026-01-26',
        appInfo: {name: 'styx-cas-experiment-view', version: '0.1.0'},
        appCapabilities: {}
      }).then(() => {
        if (!active) return;
        hostReady = true;
        notify('ui/notifications/initialized');
        paint('Waiting for Run ID', 'The presenting tool must bind this exact card to one run.');
        schedule(100);
      }).catch(() => paint('Host does not support MCP Apps initialization'));
    })();
  </script>
</body>
</html>
