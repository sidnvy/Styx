[workspace]
members = ["src/crates/styx-contracts", "src/crates/styx-core", "src/crates/styx-runtime", "src/crates/styx"]
resolver = "3"

[workspace.package]
version = "0.4.0-dev.1"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"

[workspace.dependencies]
styx-contracts = { path = "src/crates/styx-contracts" }
styx-core = { path = "src/crates/styx-core" }
styx-runtime = { path = "src/crates/styx-runtime" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
sha2 = "=0.10.9"
url = "=2.5.8"
libc = "=0.2.186"
getrandom = "=0.3.4"
nix = { version = "=0.31.3", features = ["fs", "user"] }
uuid = { version = "=1.29.0", features = ["v4"] }
tokio-util = { version = "=0.7.20", features = ["codec", "rt"] }
futures-util = { version = "=0.3.32", features = ["sink"] }
aws-lc-rs = "=1.18.1"
ed25519-dalek = { version = "=2.2.0", features = ["pem", "pkcs8"] }
base64 = "=0.22.1"
hex = "=0.4.3"
encoding_rs = "=0.8.35"
zeroize = "=1.9.1"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
clap = { version = "=4.6.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
