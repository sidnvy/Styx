name: Styx macOS app compile
on:
  pull_request:
    paths: ['vnext/host/macos/**', 'vnext/host/*macos*', 'vnext/host/test/*macos*', 'vnext/onboarding/**', '.github/workflows/styx-macos-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked VNext dependencies
        run: npm --prefix vnext ci --ignore-scripts --no-audit --no-fund
      - name: Packaging contract tests
        run: node --test vnext/host/test/macos-app.test.mjs vnext/host/macos/test/*.test.mjs
      - name: Compile native owner (no driver or signing credentials)
        run: xcrun swiftc -D STYX_TESTING -warnings-as-errors vnext/host/macos/Styx.swift -o "$RUNNER_TEMP/Styx" -framework AppKit -framework ApplicationServices -framework CoreGraphics
      - name: Native ownership self-test
        run: '"$RUNNER_TEMP/Styx" --self-test'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision checksum-pinned Cua in scratch
        run: python vnext/host/prepare-cua.py --output "$RUNNER_TEMP/styx-liveness-cua"
      - name: Verify actual Cua exits when its native owner is killed
        run: python vnext/host/macos/liveness-acceptance.py "$RUNNER_TEMP/Styx" "$RUNNER_TEMP/styx-liveness-cua/cua-driver"
      - name: Record boundaries
        run: echo 'Developer ID signing, notarization, LaunchServices responsibility, TCC, native GUI, full app crash recovery, and upgrade permission persistence NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
