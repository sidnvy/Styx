name: Styx release cache warm

# Warms shared read-only dependency caches on refs/heads/main so tag-triggered
# release builds can read them (GitHub Actions isolates tag caches from future
# tags, while every tag can read caches stored on the default branch).
# No signing environment, no secrets, no release publication.
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/providers/cua-native/**'
      - 'src/ci/release-cua.py'
      - 'src/ci/release-tunnel.json'
      - 'src/ci/cache-key.py'
      - 'src/host/prepare-codex.py'
      - 'src/host/prepare-node.py'
      - 'src/providers/browser-worker/package-lock.json'
      - 'src/host/android/app/build.gradle.kts'
      - 'src/host/android/gradle/wrapper/gradle-wrapper.properties'
      - '.github/workflows/styx-cache-warm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: styx-cache-warm-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  warm-cua-and-workers:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            container: debian:bookworm-slim
            target: x86_64-unknown-linux-gnu
          - platform: windows
            runner: windows-2025
            container: null
            target: x86_64-pc-windows-msvc
          - platform: macos
            runner: macos-15
            container: null
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Debian 12 native desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl python3 build-essential cmake clang libclang-dev pkg-config libssl-dev xz-utils patch libx11-dev libxi-dev libxtst-dev libxkbcommon-dev libwayland-dev
      - name: Preserve tracked source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Normalize the container checkout and cache path
        if: runner.os == 'Linux'
        run: |
          git config --global --add safe.directory "$(pwd -P)"
          echo "CARGO_TARGET_DIR=$(pwd -P)/target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.97.1'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: public_cache
        with:
          path: |
            ~/.cache/styx-public-dependencies
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: public-workers-${{ matrix.platform }}-${{ hashFiles('src/host/prepare-codex.py', 'src/host/prepare-node.py', 'src/ci/release-tunnel.json', 'src/providers/cua-native/**', 'src/providers/browser-worker/package-lock.json') }}
          restore-keys: |
            public-workers-${{ matrix.platform }}-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cua_cache
        with:
          path: ~/.cache/styx-cua-target
          key: cua-${{ matrix.target }}-rust1971-${{ hashFiles('src/providers/cua-native/**', 'src/ci/release-cua.py') }}
          restore-keys: |
            cua-${{ matrix.target }}-rust1971-
      - name: Build pinned upstream Cua into main cache
        if: steps.cua_cache.outputs.cache-hit != 'true' || steps.public_cache.outputs.cache-hit != 'true'
        run: python3 src/ci/release-cua.py --platform '${{ matrix.platform }}' --source-revision '${{ github.sha }}' --cache "$HOME/.cache/styx-public-dependencies" --target-dir "$HOME/.cache/styx-cua-target" --output "$RUNNER_TEMP/cua"
      - name: Save warm Cua cache on main
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: success() && steps.cua_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/styx-cua-target
          key: ${{ steps.cua_cache.outputs.cache-primary-key }}
      - name: Populate verified public worker download cache
        if: steps.public_cache.outputs.cache-hit != 'true'
        env:
          STYX_PLATFORM: ${{ matrix.platform }}
        run: |
          suffix=''
          if [ "$STYX_PLATFORM" = windows ]; then suffix='.exe'; fi
          version=$(python3 -c 'import tomllib; print(tomllib.loads(open("Cargo.toml", "rb").read().decode())["workspace"]["package"]["version"])')
          python3 src/ci/release-workers.py prepare --platform "$STYX_PLATFORM" --cache "$HOME/.cache/styx-public-dependencies" --output "$RUNNER_TEMP/workers" --version "$version" --cua-binary "$RUNNER_TEMP/cua/bin/cua-driver$suffix" --cua-receipt "$RUNNER_TEMP/cua/receipt.json"
          python3 src/ci/release-tunnel.py --platform "$STYX_PLATFORM" --cache "$HOME/.cache/styx-public-dependencies" --output "$RUNNER_TEMP/workers/tunnel"
      - name: Save warm public worker cache on main
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: success() && steps.public_cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/styx-public-dependencies
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: ${{ steps.public_cache.outputs.cache-primary-key }}

  warm-release-deps:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            container: debian:bookworm-slim
            target: x86_64-unknown-linux-gnu
          - platform: windows
            runner: windows-2025
            container: null
            target: x86_64-pc-windows-msvc
          - platform: macos
            runner: macos-15
            container: null
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Debian 12 build tools
        if: matrix.platform == 'linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl python3 build-essential cmake clang libclang-dev pkg-config libssl-dev xz-utils
      - name: Preserve tracked source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - name: Normalize the container checkout and cache path
        if: runner.os == 'Linux'
        run: |
          git config --global --add safe.directory "$(pwd -P)"
          echo "CARGO_TARGET_DIR=$(pwd -P)/target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.97.1'
      - name: Compute external dependency cache key
        id: cache_key
        run: echo "deps=$(python3 -I -B src/ci/cache-key.py deps-hash)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: release_deps_cache
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: release-deps-${{ matrix.platform }}-${{ matrix.target }}-rust1971-${{ steps.cache_key.outputs.deps }}
          restore-keys: |
            release-deps-${{ matrix.platform }}-${{ matrix.target }}-rust1971-
      - name: Compile external release dependencies
        if: steps.release_deps_cache.outputs.cache-hit != 'true'
        run: |
          jobs=$(python3 -c 'import os; print(os.cpu_count() or 2)')
          cargo fetch --locked --target '${{ matrix.target }}'
          cargo build --release -p styx --target '${{ matrix.target }}' --locked --offline --jobs "$jobs"
          python3 -I -B src/ci/cache-key.py prune-target --target-dir "$CARGO_TARGET_DIR"
      - name: Save warm release dependency cache on main
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: success() && steps.release_deps_cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: ${{ steps.release_deps_cache.outputs.cache-primary-key }}

  warm-android-deps:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.97.1'
          targets: aarch64-linux-android
      - name: Compute external Android dependency cache key
        id: android_cache_key
        run: echo "deps=$(python3 -I -B src/ci/cache-key.py deps-hash --extra src/host/android/app/build.gradle.kts --extra src/host/android/gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: android_deps_cache
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            ~/.gradle/caches
            ~/.gradle/wrapper
            target
          key: release-android-deps-arm64-rust1971-${{ steps.android_cache_key.outputs.deps }}
          restore-keys: |
            release-android-deps-arm64-rust1971-
      - name: Warm Android Rust and Gradle caches
        if: steps.android_deps_cache.outputs.cache-hit != 'true'
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export CARGO_BUILD_JOBS="$(nproc)"
          export STYX_ARTIFACT_ROOT="$RUNNER_TEMP/android-warm"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          cargo fetch --locked --target aarch64-linux-android
          python3 -I -B src/ci/release-android.py --unsigned --output "$RUNNER_TEMP/android-assets" --build-number 1
          python3 -I -B src/ci/cache-key.py prune-target --target-dir "$CARGO_TARGET_DIR"
      - name: Save warm Android dependency cache on main
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: success() && steps.android_deps_cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            ~/.gradle/caches
            ~/.gradle/wrapper
            target
          key: ${{ steps.android_deps_cache.outputs.cache-primary-key }}
