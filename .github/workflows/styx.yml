name: Styx contracts
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/styx.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/styx.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust-quality:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Debian 12 build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl python3 build-essential cmake clang libclang-dev pkg-config libssl-dev xz-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: src/providers/browser-worker/package-lock.json
      - name: Normalize the container checkout and cache path
        run: |
          git config --global --add safe.directory "$(pwd -P)"
          echo "CARGO_TARGET_DIR=$(pwd -P)/target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.97.1'
          components: clippy,rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: quality-linux-rust1971-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            quality-linux-rust1971-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
            quality-linux-rust1971-
      - name: Locked dependencies and available CPU budget
        run: |
          echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          npm --prefix src/providers/browser-worker ci --ignore-scripts --no-audit --no-fund
      - name: Rust format, lint, workspace tests and CLI checks
        run: python3 -I -B src/ci/rust-quality.py --evidence "$RUNNER_TEMP/quality" --target-dir "$CARGO_TARGET_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rust-quality-receipt
          path: ${{ runner.temp }}/quality/receipt.json
          if-no-files-found: warn
          retention-days: 14

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked JavaScript deps
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independently locked provider dependencies
        run: |
          npm --prefix packages/styx-browser-provider ci --ignore-scripts --no-audit --no-fund
      - name: Pinned native source inventory and bounded license evidence
        run: |
          python -m unittest discover -s ci/test -p test_native_inventory.py
          python ci/native_inventory.py --fetch \
            --cache acceptance/native-source-cache \
            --output acceptance/native-source-inventory \
            --metadata-limit 12 \
            --crate serde@1.0.228 --crate ring@0.17.14 --crate tokio@1.52.3
      - name: Remaining JavaScript contracts
        run: npm run test:all
  native-contracts:
    name: Native contracts on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve tracked source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: runner.os != 'Linux'
        with:
          toolchain: '1.97.1'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: runner.os != 'Linux'
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: native-check-${{ matrix.target }}-rust1971-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            native-check-${{ matrix.target }}-rust1971-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
            native-check-${{ matrix.target }}-rust1971-
            release-${{ runner.os == 'macOS' && 'macos' || 'windows' }}-${{ matrix.target }}-rust1971-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
            release-${{ runner.os == 'macOS' && 'macos' || 'windows' }}-${{ matrix.target }}-rust1971-
      - name: Check every Rust target on the native platform
        if: runner.os != 'Linux'
        run: cargo check --locked --workspace --all-targets --release --target '${{ matrix.target }}'
      - name: Install locked Host test dependencies
        run: |
          npm --prefix src ci --ignore-scripts --no-audit --no-fund
          npm --prefix src/packages/styx-browser-provider ci --ignore-scripts --no-audit --no-fund
          npm --prefix src/providers/browser-worker ci --ignore-scripts --no-audit --no-fund
      - name: Select the installed desktop browser
        run: |
          python - <<'PYTHON'
          import os, pathlib, sys
          if sys.platform == 'darwin':
              candidates = ['/Applications/Google Chrome.app/Contents/MacOS/Google Chrome']
          elif sys.platform == 'win32':
              candidates = [os.path.join(os.environ[key], suffix) for key in ('PROGRAMFILES', 'PROGRAMFILES(X86)', 'LOCALAPPDATA') if key in os.environ for suffix in (r'Google\Chrome\Application\chrome.exe', r'Microsoft\Edge\Application\msedge.exe')]
          else:
              candidates = ['/opt/google/chrome/chrome', '/usr/lib/chromium/chromium']
          selected = next((str(pathlib.Path(p).resolve()) for p in candidates if pathlib.Path(p).is_file()), None)
          if not selected:
              raise SystemExit('No installed desktop browser on the native runner')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('STYX_BROWSER_EXECUTABLE=' + selected + '\n')
          PYTHON
      - name: Provide a Linux test display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Exercise the visible Browser and external-page handoff
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node --test src/providers/browser-worker/worker.test.mjs
          else
            node --test src/providers/browser-worker/worker.test.mjs
          fi
      - name: Remaining platform contracts
        run: npm --prefix src run test:all
      - name: Validate checksum and safe archive extraction regressions
        run: python -m unittest discover -s src/host/test -p test_prepare_node.py
      - name: Check Windows native build script syntax
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem src/host/windows -Filter '*.ps1')
          foreach ($scriptFile in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptFile.FullName, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              throw ('PowerShell parsing failed: ' + $scriptFile.Name + ': ' + $parseErrors[0].Message)
            }
          }
      - name: Compile native Windows shell and construct its own controls
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'styx-windows-ui'
          & ./src/host/windows/build.ps1 -OutputDirectory $output
          Copy-Item src/assets/brand/styx-logo.png (Join-Path $output 'styx-logo.png')
          $app = Start-Process (Join-Path $output 'StyxPreview.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Windows native control construction failed' }
