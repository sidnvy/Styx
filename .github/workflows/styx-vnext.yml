name: Styx VNext contracts
on:
  push:
    paths:
      - 'vnext/**'
      - '.github/workflows/styx-vnext.yml'
  pull_request:
    paths:
      - 'vnext/**'
      - '.github/workflows/styx-vnext.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vnext
    steps:
      - uses: actions/checkout@v4
        with:
          # Migration tests verify real historical signed source closures.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vnext/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked JavaScript deps
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independently locked provider dependencies
        run: |
          npm --prefix packages/styx-exec-adapter ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/styx-gui-broker ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/styx-browser-provider ci --ignore-scripts --no-audit --no-fund
      - name: Pinned native source inventory and bounded license evidence
        run: |
          python -m unittest discover -s ci/test -p test_native_inventory.py
          python ci/native_inventory.py --fetch \
            --cache acceptance/native-source-cache \
            --output acceptance/native-source-inventory \
            --metadata-limit 12 \
            --crate serde@1.0.228 --crate ring@0.17.14 --crate tokio@1.52.3
      - name: Pin and verify the official Codex executor
        run: python3 packages/styx-exec-adapter/prepare-runtime.py
      - name: Required dependency audits, SBOMs and complete contract regression
        run: npm run quality -- acceptance/quality
      - name: Real executor via authenticated MCP and native process RPC
        run: node ci/acceptance.mjs native-exec acceptance/native-exec
      - name: Report failed fixture details
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='acceptance/quality/fixtures',file=root+'/receipt.json';
          if(fs.existsSync(file)){
            const receipt=JSON.parse(fs.readFileSync(file,'utf8'));
            console.log(JSON.stringify({revision:receipt.revision,status:receipt.status,suites:receipt.suites},null,2));
            for(const suite of receipt.suites??[]){
              if(suite.status!=='FAIL'||!/^[-a-z]+\.tap$/.test(suite.log??''))continue;
              const lines=fs.readFileSync(root+'/'+suite.log,'utf8').split('\n');let shown=0;
              for(let i=0;i<lines.length&&shown<20;i++)if(/^\s*not ok \d+/.test(lines[i])){
                console.log(lines.slice(Math.max(0,i-1),i+30).join('\n'));shown++;
              }
            }
          }
          NODE
      - name: Preserve acceptance receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-contract-and-native-exec-evidence
          path: vnext/acceptance/
          if-no-files-found: error
  native-cua-contract:
    name: Cua MCP on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: macos-15
          - runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Host test dependencies
        run: |
          npm --prefix vnext ci --ignore-scripts --no-audit --no-fund
          npm --prefix vnext/packages/styx-browser-provider ci --ignore-scripts --no-audit --no-fund
      - name: Prepare official independent Node and native Host executors
        run: |
          set -euo pipefail
          python vnext/host/prepare-node.py "$RUNNER_TEMP/styx-node-native"
          python vnext/host/prepare-codex.py --output "$RUNNER_TEMP/styx-codex-native"
          python vnext/host/prepare-cua.py --output "$RUNNER_TEMP/styx-cua-native"
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          echo "STYX_TEST_NODE_BINARY=$RUNNER_TEMP/styx-node-native/node$suffix" >> "$GITHUB_ENV"
          echo "STYX_TEST_CODEX_BINARY=$RUNNER_TEMP/styx-codex-native/codex$suffix" >> "$GITHUB_ENV"
          echo "STYX_TEST_CUA_BINARY=$RUNNER_TEMP/styx-cua-native/cua-driver$suffix" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            echo "STYX_TEST_LINUX_NODE=$RUNNER_TEMP/styx-node-native/node" >> "$GITHUB_ENV"
          fi
      - name: Validate checksum and safe archive extraction regressions
        run: python -m unittest discover -s vnext/host/test -p test_prepare_node.py
      - name: Validate portable signed staging and local pairing identity
        run: node --test --test-concurrency=1 vnext/host/test/*.test.mjs vnext/host/windows/*.test.mjs vnext/host/windows/platform-update/product.test.mjs
      - name: Check Windows interactive-task installer syntax
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        run: |
          $file = (Resolve-Path 'vnext/host/windows-task.ps1').Path
          $scripts = @((Get-Item $file)) + @(Get-ChildItem vnext/host/windows -Filter '*.ps1')
          foreach ($scriptFile in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptFile.FullName, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              throw ('PowerShell parsing failed: ' + $scriptFile.Name + ': ' + $parseErrors[0].Message)
            }
          }
          $script = [IO.File]::ReadAllText($file)
          if (-not $script.Contains('LogonType Interactive') -or
              -not $script.Contains('RunLevel Limited') -or
              -not $script.Contains('task_owner_mismatch')) {
            throw 'Windows scheduled task must retain interactive user identity checks'
          }
      - name: Compile native Windows shell and construct its own controls
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'styx-windows-ui'
          & ./vnext/host/windows/build.ps1 -OutputDirectory $output
          Copy-Item vnext/assets/brand/styx-logo.png (Join-Path $output 'styx-logo.png')
          $app = Start-Process (Join-Path $output 'StyxPreview.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Windows native control construction failed' }
      - name: Real Windows MCP Exec and installed Edge acceptance
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        run: |
          npm --prefix vnext/packages/styx-browser-provider ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked Browser dependencies unavailable' }
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          if (-not (Test-Path -LiteralPath $edge)) { throw 'Installed Edge required for native browser acceptance' }
          $inputFile = Join-Path $env:RUNNER_TEMP 'styx-windows-mcp-input.json'
          $config = @{
            directory = Join-Path $env:RUNNER_TEMP 'styx-windows-mcp'
            nodeBinary = $env:STYX_TEST_NODE_BINARY
            nodeLicenseFile = Join-Path (Split-Path $env:STYX_TEST_NODE_BINARY) 'LICENSE'
            codexBinary = $env:STYX_TEST_CODEX_BINARY
            cuaBinary = $env:STYX_TEST_CUA_BINARY
            edgeBinary = $edge
            desktopProbeFile = Join-Path $env:RUNNER_TEMP 'styx-windows-ui/StyxSessionProbe.exe'
          }
          [IO.File]::WriteAllText($inputFile, ($config | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          $env:STYX_RUN_WINDOWS_NATIVE_ACCEPTANCE = '1'
          node vnext/host/windows/native-mcp-acceptance.mjs $inputFile
          if ($LASTEXITCODE -ne 0) { throw 'Windows real MCP acceptance failed; inspect its receipt' }
      - name: Preserve Windows native receipts without private fixture state
        if: always() && matrix.runner == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-mcp-and-controls
          path: |
            ${{ runner.temp }}/styx-windows-mcp/receipt.json
            ${{ runner.temp }}/styx-windows-ui/native-self-test.json
          if-no-files-found: warn
      - name: Record native GUI acceptance boundary
        shell: bash
        run: |
          echo 'Native Cua schema compatibility is a protocol check.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native GUI: NOT RUN. Physical Host: NOT RUN. Cold install: NOT RUN. ChatGPT: NOT RUN. 24-hour soak: NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run pinned native Cua MCP compatibility test
        env:
          DO_NOT_TRACK: '1'
          CUA_DRIVER_RS_TELEMETRY_ENABLED: 'false'
          STYX_CUA_SCHEMA_ONLY: '1'
          STYX_CUA_DIRECT: '0'
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            executable=cua-driver.exe
          else
            executable=cua-driver
          fi
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            export STYX_CUA_DIRECT='1'
          fi
          export STYX_CUA_PORTABLE_MANIFEST="$GITHUB_WORKSPACE/vnext/gateway/cua-portable-0.36.0.json"
          node vnext/host/native-cua-smoke.cjs "$RUNNER_TEMP/styx-cua-native/$executable"
