name: Styx VNext contracts
on:
  push:
    paths:
      - 'vnext/**'
      - '.github/workflows/styx-vnext.yml'
  pull_request:
    paths:
      - 'vnext/**'
      - '.github/workflows/styx-vnext.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vnext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vnext/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked JavaScript deps
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install independently locked provider dependencies
        run: |
          npm --prefix packages/styx-exec-adapter ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/styx-gui-broker ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/styx-browser-provider ci --ignore-scripts --no-audit --no-fund
      - name: Pinned native source inventory and bounded license evidence
        run: |
          python -m unittest discover -s ci/test -p test_native_inventory.py
          python ci/native_inventory.py --fetch \
            --cache acceptance/native-source-cache \
            --output acceptance/native-source-inventory \
            --metadata-limit 12 \
            --crate serde@1.0.228 --crate ring@0.17.14 --crate tokio@1.52.3
      - name: Pin and verify the official Codex executor
        run: python3 packages/styx-exec-adapter/prepare-runtime.py
      - name: Required dependency audits, SBOMs and complete contract regression
        run: npm run quality -- acceptance/quality
      - name: Real executor via authenticated MCP and native process RPC
        run: node ci/acceptance.mjs native-exec acceptance/native-exec
      - name: Preserve acceptance receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-contract-and-native-exec-evidence
          path: vnext/acceptance/
          if-no-files-found: error
  native-cua-contract:
    name: Cua MCP on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: macos-15
          - runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Host test dependencies
        run: npm --prefix vnext ci --ignore-scripts --no-audit --no-fund
      - name: Prepare official independent Node and native Host executors
        run: |
          set -euo pipefail
          python vnext/host/prepare-node.py "$RUNNER_TEMP/styx-node-native"
          python vnext/host/prepare-codex.py --output "$RUNNER_TEMP/styx-codex-native"
          python vnext/host/prepare-cua.py --output "$RUNNER_TEMP/styx-cua-native"
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          echo "STYX_TEST_NODE_BINARY=$RUNNER_TEMP/styx-node-native/node$suffix" >> "$GITHUB_ENV"
          echo "STYX_TEST_CODEX_BINARY=$RUNNER_TEMP/styx-codex-native/codex$suffix" >> "$GITHUB_ENV"
          echo "STYX_TEST_CUA_BINARY=$RUNNER_TEMP/styx-cua-native/cua-driver$suffix" >> "$GITHUB_ENV"
      - name: Validate checksum and safe archive extraction regressions
        run: python -m unittest discover -s vnext/host/test -p test_prepare_node.py
      - name: Validate portable signed staging and local pairing identity
        run: node --test --test-concurrency=1 vnext/host/test/*.test.mjs vnext/host/windows/*.test.mjs
      - name: Check Windows interactive-task installer syntax
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $file = (Resolve-Path 'vnext/host/windows-task.ps1').Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            $file, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            throw ('PowerShell task installer parsing failed: ' + $parseErrors[0].Message)
          }
          $script = [IO.File]::ReadAllText($file)
          if (-not $script.Contains('LogonType Interactive') -or
              -not $script.Contains('RunLevel Limited') -or
              -not $script.Contains('task_owner_mismatch')) {
            throw 'Windows scheduled task must retain interactive user identity checks'
          }
      - name: Record native GUI acceptance boundary
        shell: bash
        run: |
          echo 'Native Cua schema compatibility is a protocol check.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native GUI: NOT RUN. Physical Host: NOT RUN. Cold install: NOT RUN. ChatGPT: NOT RUN. 24-hour soak: NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run pinned native Cua MCP compatibility test
        env:
          DO_NOT_TRACK: '1'
          CUA_DRIVER_RS_TELEMETRY_ENABLED: 'false'
          STYX_CUA_SCHEMA_ONLY: '1'
          STYX_CUA_DIRECT: '0'
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            executable=cua-driver.exe
          else
            executable=cua-driver
          fi
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            export STYX_CUA_DIRECT='1'
          fi
          export STYX_CUA_PORTABLE_MANIFEST="$GITHUB_WORKSPACE/vnext/gateway/cua-portable-0.36.0.json"
          node vnext/host/native-cua-smoke.cjs "$RUNNER_TEMP/styx-cua-native/$executable"
