name: Styx release workflow checks
on:
  push:
    branches: [develop, main]
    paths: ['.github/workflows/styx-release*.yml', 'src/ci/release-*', 'src/ci/test/test_release*.py', 'src/tools/release/build-native-binary.py']
  pull_request:
    paths: ['.github/workflows/styx-release*.yml', 'src/ci/release-*', 'src/ci/test/test_release*.py', 'src/tools/release/build-native-binary.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: src/providers/browser-worker/package-lock.json
      - name: Install the locked Browser closure used by the Runtime budget test
        run: npm --prefix src/providers/browser-worker ci --ignore-scripts --no-audit --no-fund
      - name: Release orchestration failure and archive boundaries
        run: python3 -I -B -m unittest discover -s src/ci/test -p 'test_release*.py'
      - name: Check workflow semantics with the pinned official actionlint binary
        run: |
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/styx-release.yml .github/workflows/styx-release-check.yml
